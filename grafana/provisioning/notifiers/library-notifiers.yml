apiVersion: 1

notifiers:
  - name: Library System Email Alerts
    type: email
    uid: library-email-alerts
    org_id: 1
    is_default: false
    settings:
      addresses: admin@library.com
      singleEmail: true
    secure_settings: {}
    send_reminder: true
    frequency: 1m
    disable_resolve_message: false

  - name: Library System Slack Alerts
    type: slack
    uid: library-slack-alerts
    org_id: 1
    is_default: false
    settings:
      url: https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK
      recipient: "#library-alerts"
      mentionChannel: "here"
      mentionUsers: ""
      iconEmoji: ":books:"
      iconUrl: ""
      username: "Library Alert Bot"
    secure_settings: {}
    send_reminder: true
    frequency: 1m
    disable_resolve_message: false

  - name: Library System Discord Alerts
    type: discord
    uid: library-discord-alerts
    org_id: 1
    is_default: false
    settings:
      url: https://discord.com/api/webhooks/YOUR_DISCORD_WEBHOOK
      use_discord_username: true
    secure_settings: {}
    send_reminder: true
    frequency: 1m
    disable_resolve_message: false

  - name: Library System Webhook Alerts
    type: webhook
    uid: library-webhook-alerts
    org_id: 1
    is_default: false
    settings:
      url: http://localhost:8080/api/v1/alerts/webhook
      httpMethod: POST
      maxAlerts: 100
    secure_settings: {}
    send_reminder: true
    frequency: 1m
    disable_resolve_message: false
