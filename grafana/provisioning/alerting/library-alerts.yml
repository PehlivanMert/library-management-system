apiVersion: 1

groups:
  - name: Library System Alerts
    folder: Library Alerts
    interval: 30s
    rules:
      # System Health Alerts
      - name: System Down
        condition: up == 0
        for: 1m
        labels:
          severity: critical
          service: library-system
        annotations:
          summary: "Library Management System is down"
          description: "The library management system has been down for more than 1 minute"

      # HTTP Error Rate Alerts
      - name: High HTTP Error Rate
        condition: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "High HTTP 5xx error rate detected"
          description: "HTTP 5xx error rate is {{ $value }} errors per second"

      - name: Critical HTTP Error Rate
        condition: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 1.0
        for: 1m
        labels:
          severity: critical
          service: library-system
        annotations:
          summary: "Critical HTTP 5xx error rate detected"
          description: "HTTP 5xx error rate is {{ $value }} errors per second"

      # Response Time Alerts
      - name: High Response Time
        condition: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2.0
        for: 3m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      - name: Critical Response Time
        condition: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 5.0
        for: 2m
        labels:
          severity: critical
          service: library-system
        annotations:
          summary: "Critical response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      # Business Logic Alerts
      - name: No Books Available
        condition: library_books_total == 0
        for: 1m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "No books available in the system"
          description: "The library system has no books registered"

      - name: No Users Registered
        condition: library_users_total == 0
        for: 1m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "No users registered in the system"
          description: "The library system has no registered users"

      - name: High Overdue Loans
        condition: library_loans_overdue_total > 10
        for: 5m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "High number of overdue loans"
          description: "There are {{ $value }} overdue loans in the system"

      # Email System Alerts
      - name: Email Errors Detected
        condition: library_emails_errors_total > 0
        for: 2m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "Email errors detected"
          description: "{{ $value }} email errors have occurred"

      - name: High Email Error Rate
        condition: library_emails_errors_total > 5
        for: 1m
        labels:
          severity: critical
          service: library-system
        annotations:
          summary: "High email error rate"
          description: "{{ $value }} email errors have occurred"

      # Notification System Alerts
      - name: Notification Errors Detected
        condition: library_notifications_errors_total > 0
        for: 2m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "Notification errors detected"
          description: "{{ $value }} notification errors have occurred"

      - name: High Notification Error Rate
        condition: library_notifications_errors_total > 5
        for: 1m
        labels:
          severity: critical
          service: library-system
        annotations:
          summary: "High notification error rate"
          description: "{{ $value }} notification errors have occurred"

      # Request Rate Alerts
      - name: High Request Rate
        condition: rate(http_server_requests_seconds_count[5m]) > 100
        for: 2m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "High request rate detected"
          description: "Request rate is {{ $value }} requests per second"

      - name: Very High Request Rate
        condition: rate(http_server_requests_seconds_count[5m]) > 500
        for: 1m
        labels:
          severity: critical
          service: library-system
        annotations:
          summary: "Very high request rate detected"
          description: "Request rate is {{ $value }} requests per second"

      # Database Connection Alerts (if available)
      - name: Database Connection Issues
        condition: up{job="library-management-system"} == 0
        for: 30s
        labels:
          severity: critical
          service: library-system
        annotations:
          summary: "Database connection issues detected"
          description: "The application cannot connect to the database"

      # Memory/Resource Alerts (if JVM metrics available)
      - name: High Memory Usage
        condition: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          service: library-system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      - name: Critical Memory Usage
        condition: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.95
        for: 2m
        labels:
          severity: critical
          service: library-system
        annotations:
          summary: "Critical memory usage detected"
          description: "Memory usage is {{ $value | humanizePercentage }}"
